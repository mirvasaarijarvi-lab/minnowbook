version: 2
updates:
  # npm dependencies (includes js-yaml and any transitive YAML parsers like yaml, @stoplight/yaml, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    # NOTE: no `labels:` here on purpose. Dependabot errors on every PR when a
    # label does not exist in the repo, and this repo has no dependency labels.

    # Group routine updates so security PRs stand out on their own.
    # Every group lands as ONE pull request, which is what the
    # dependency-audit checks in .github/workflows/security-scan.yml grade:
    # the gate job (high/critical) plus the "Dependency audit report" job,
    # which diffs the PR against the base branch and annotates only the
    # advisories the update itself introduces. Neither job needs repository
    # secrets, so they run normally on Dependabot pull requests.
    groups:
      # @tanstack router/start packages must always move together; a
      # partial update breaks the build.
      tanstack:
        patterns:
          - "@tanstack/*"
      yaml-parsers:
        patterns:
          - "js-yaml"
          - "yaml"
          - "@types/js-yaml"
          - "@stoplight/yaml*"
          - "yaml-ast-parser"
      # Build/test toolchain moves as one PR so a Vite bump and its plugins
      # are audited and built together rather than in sequence.
      build-toolchain:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
          - "typescript"
          - "jsdom"
      linting:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "prettier"
          - "globals"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/js-yaml"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "js-yaml"
          - "yaml"
    ignore:
      # react-router / react-router-dom are no longer dependencies: the app
      # routes entirely through @tanstack/react-router. Blocked here so a
      # transitive reintroduction never opens an update PR for them.
      - dependency-name: "react-router"
      - dependency-name: "react-router-dom"
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # React type definitions must stay on the same major as React 18.
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Tailwind v4 is a breaking rewrite; project is pinned to v3.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/typography"
        update-types: ["version-update:semver-major"]
      # Vite is pinned to v5 by the Lovable stack.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react-swc"
        update-types: ["version-update:semver-major"]
      # shadcn/ui pins these; their majors are breaking API rewrites and are
      # upgraded deliberately, not by bot PRs.
      - dependency-name: "react-day-picker"
        update-types: ["version-update:semver-major"]
      - dependency-name: "date-fns"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      # Recharts major upgrades replace a large transitive graph and
      # Dependabot only refreshes package-lock.json, while CI also requires
      # bun.lock. Upgrade Recharts majors deliberately with both lockfiles.
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vaul"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@hookform/resolvers"
        update-types: ["version-update:semver-major"]
      # sonner v2 changes the toast API surface shadcn's toaster wraps.
      - dependency-name: "sonner"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]

      # ESLint 10 / flat-config plugin majors need a manual config migration.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]

      # Test toolchain majors change APIs and Node floors; upgrade manually.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"

  # GitHub Actions used in CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # No labels: the repo has no `dependencies` / `ci` labels, and Dependabot
    # reports an error comment on every PR when a configured label is missing.

    commit-message:
      prefix: "chore(ci)"
