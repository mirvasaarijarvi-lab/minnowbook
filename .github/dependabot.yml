version: 2
updates:
  # JavaScript dependencies (includes js-yaml and any transitive YAML parsers
  # like yaml, @stoplight/yaml, etc.). The project is managed by Bun
  # (bun.lock is the source of truth), and Dependabot's npm ecosystem refuses
  # to run on Bun projects, so this must stay "bun".
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 10
    # NOTE: no `labels:` here on purpose. Dependabot errors on every PR when a
    # label does not exist in the repo, and this repo has no dependency labels.

    # Version updates arrive as two pull requests. applies-to stays on
    # version-updates, so security updates stay ungrouped. The minor-and-patch
    # group still moves every package together, including @tanstack router
    # and start, because a partial TanStack update breaks the build.
    # Grouped pull requests are still graded by the dependency-audit checks
    # in .github/workflows/security-scan.yml: the gate job (high/critical)
    # plus the "Dependency audit report" job, which diffs the PR against the
    # base branch and annotates only the advisories the update itself
    # introduces. Neither job needs repository secrets, so they run normally
    # on Dependabot pull requests.
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Newer Query observer snapshots caused a DashboardSidebar update loop
      # before Offers could appear. Hold the browser-verified 5.104.2 release
      # until a deliberate upgrade passes the complete dashboard offer suite.
      - dependency-name: "@tanstack/react-query"
      - dependency-name: "@tanstack/query-core"
      # react-router / react-router-dom are no longer dependencies: the app
      # routes entirely through @tanstack/react-router. Blocked here so a
      # transitive reintroduction never opens an update PR for them.
      - dependency-name: "react-router"
      - dependency-name: "react-router-dom"
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # React type definitions must stay on the same major as React 19.
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Tailwind v4 is configured through src/styles.css; a v5 rewrite would
      # need a manual migration.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/typography"
        update-types: ["version-update:semver-major"]
      # Vite majors move together with the TanStack Start plugins and need
      # both lockfiles regenerated; upgrade deliberately.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # shadcn/ui pins these; their majors are breaking API rewrites and are
      # upgraded deliberately, not by bot PRs.
      - dependency-name: "react-day-picker"
        update-types: ["version-update:semver-major"]
      - dependency-name: "date-fns"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      # Recharts major upgrades replace a large transitive graph and
      # Dependabot only refreshes bun.lock, while CI also requires
      # package-lock.json. Upgrade Recharts majors deliberately with both lockfiles.
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vaul"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@hookform/resolvers"
        update-types: ["version-update:semver-major"]
      # sonner v2 changes the toast API surface shadcn's toaster wraps.
      - dependency-name: "sonner"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]

      # ESLint 10 / flat-config plugin majors need a manual config migration.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]

      # Test toolchain majors change APIs and Node floors; upgrade manually.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"

  # GitHub Actions used in CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 5
    # No labels: the repo has no `dependencies` / `ci` labels, and Dependabot
    # reports an error comment on every PR when a configured label is missing.
    # One group for every action. Security updates stay ungrouped.
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"

    commit-message:
      prefix: "chore(ci)"
