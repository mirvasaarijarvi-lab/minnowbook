name: Stale result check

# Marks finished checks on the previous commit of the default branch as
# stale, so a green or red result from an outdated commit is not mistaken
# for the latest code. Pushes to any other branch do not start a run.
#
# The workflow_run list is the source of watched workflow names for the
# push job. scripts/ci/stale-result-check.test.ts extracts the same lines.
# branches-ignore matches every branch, so a completed workflow does not
# start this workflow. The stale job still ignores cancelled runs if that
# filter is ever narrowed.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows:
      - CI Build Check
      - Lint
      - Lockfile sync (npm)
      - Lockfile three-way sync
      - Package registry and audit gate
      - Dependency audit
      - E2E Tests
      - Security Regression Tests (Unit)
      - RLS / CORS Security Gate
      - Access control tests
      - Guest link test backend
      - Offer kitchen mapping
    types: [completed]
    # `**` matches every branch name, including names that contain
    # slashes, so this event does not create a run.
    branches-ignore:
      - "**"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    name: stale-result
    # Runs cancelled because a newer commit arrived have no result to
    # mark; the newer run reports instead. Completed runs are still checked.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: bash scripts/ci/stale-commit-check.sh
      - name: Mark the tested commit's results as stale
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TIP: ${{ steps.check.outputs.tip_sha }}
          BEHIND: ${{ steps.check.outputs.behind_by }}
          WF: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          gh api "repos/${REPO}/check-runs" --method POST \
            -f name="Stale result: ${WF}" \
            -f head_sha="${TESTED_SHA}" \
            -f status=completed \
            -f conclusion=neutral \
            -f "output[title]=STALE: ${WF} (${CONCLUSION}) tested an older commit" \
            -f "output[summary]=This ${CONCLUSION} result is for ${TESTED_SHA:0:7}. The branch head is now ${TIP:0:7} (${BEHIND} newer commit(s)), so it does not describe the latest code. Run: ${RUN_URL}"

  stale-after-push:
    name: stale-after-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Mark finished checks on the previous commit as stale
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # The watched workflows are the ones listed under on.workflow_run,
          # so the push job covers the same checks. A manual dispatch has no
          # before/after commits; the script exits without marking anything.
          WORKFLOWS=$(sed -n '/^  workflow_run:/,/^    types:/p' .github/workflows/stale-result-check.yml \
            | sed -n 's/^      - //p')
          export WORKFLOWS
          bash scripts/ci/mark-stale-on-push.sh
