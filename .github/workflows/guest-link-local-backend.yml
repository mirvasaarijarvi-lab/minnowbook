name: Guest link test backend

# Runs the revoked guest-link integration test against a throwaway local
# backend (supabase start + functions serve), never the live project.
# The backend is built from supabase/migrations, seeded with one owner and
# one booking (scripts/ci/seed-guest-portal-local.sql), and discarded.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  log-guard:
    name: Guest link log guard (fake secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Stale commit check
        uses: ./.github/actions/stale-commit-check
      - name: Inject fake credentials into every output path
        run: bash scripts/ci/guest-link-log-guard.test.sh
      # Flags any step whose logs or saved files skip the secret guard.
      - name: Every step goes through the secret guard
        run: |
          node --test scripts/ci/guest-link-step-guard.test.mjs
          node scripts/ci/guest-link-step-guard.mjs

  revoked-link:
    name: Revoked guest link (local backend)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      DENO_DIR: ${{ github.workspace }}/.deno-cache
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Stale commit check
        uses: ./.github/actions/stale-commit-check
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v1.x

      - name: Write placeholder migrations
        run: scripts/ci/write-placeholder-migrations.sh

      - name: Free Supabase ports
        continue-on-error: true
        run: |
          sudo systemctl stop postgresql 2>/dev/null || true
          docker ps -aq --filter "name=supabase_" | xargs -r docker rm -f || true

      - name: Start local backend
        timeout-minutes: 20
        run: |
          # `supabase start` prints the local keys and database URL, so its
          # output goes to a file and every value is masked before anything
          # from it can reach the log.
          mask_local_credentials() {
            supabase status -o env 2>/dev/null | while IFS='=' read -r _ value; do
              value="${value%\"}"; value="${value#\"}"
              [ -n "$value" ] && echo "::add-mask::$value"
            done
          }
          for attempt in 1 2 3; do
            if supabase start --exclude=imgproxy,mailpit,studio,realtime > /tmp/supabase-start.log 2>&1; then
              mask_local_credentials
              echo "local backend started"
              exit 0
            fi
            mask_local_credentials
            echo "::warning::supabase start attempt ${attempt} failed, retrying"
            eval "$(supabase status -o env 2>/dev/null)" || true
            scripts/ci/guest-link-log-guard.sh filter /tmp/supabase-start.log 40
            supabase stop --no-backup > /dev/null 2>&1 || true
            sleep 10
          done
          exit 1

      - name: Seed test owner and booking
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/ci/seed-guest-portal-local.sql

      - name: Serve guest-booking-portal
        run: |
          nohup supabase functions serve guest-booking-portal --no-verify-jwt > /tmp/functions-serve.log 2>&1 &
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/guest-booking-portal || true)
            [ "$code" != "000" ] && [ "$code" != "502" ] && [ "$code" != "503" ] && { echo "function up (${code})"; exit 0; }
            sleep 2
          done
          scripts/ci/guest-link-log-guard.sh filter /tmp/functions-serve.log 80; exit 1

      - name: Run revoked-link test
        run: |
          eval "$(supabase status -o env)"
          TOKEN=$(curl -sf -X POST "$API_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d '{"email":"ci-guest-portal-owner@example.invalid","password":"ci-guest-portal-password"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$TOKEN"
          echo "GUEST_LINK_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          # Test output goes to a file first and reaches the log only
          # through the guard's filter.
          status=0
          GUEST_PORTAL_TEST_BACKEND=local \
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          GUEST_PORTAL_TEST_ACCESS_TOKEN="$TOKEN" \
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/guest-booking-portal/revoked-token.integration.test.ts \
            supabase/functions/guest-booking-portal/revoke-isolation.integration.test.ts \
            > /tmp/revoked-test.log 2>&1 || status=$?
          scripts/ci/guest-link-log-guard.sh filter /tmp/revoked-test.log 200
          [ "$status" -eq 0 ] || { echo "::error::test failed"; exit 1; }
          grep -q "2 passed" /tmp/revoked-test.log || { echo "::error::tests did not run or failed"; exit 1; }

      - name: Check logs hold no credentials
        if: always()
        run: |
          eval "$(supabase status -o env 2>/dev/null)" || true
          scripts/ci/guest-link-log-guard.sh scan /tmp/revoked-test.log /tmp/functions-serve.log

      - name: Function log on failure
        if: failure()
        run: |
          eval "$(supabase status -o env 2>/dev/null)" || true
          scripts/ci/guest-link-log-guard.sh filter /tmp/functions-serve.log 200

      # Delete the throwaway backend on EVERY exit: success, startup
      # failure, test failure and cancellation. `always()` also runs after
      # a cancel, so this step must stay last and never depend on earlier
      # outputs. Keys are never printed: all output goes to /dev/null.
      - name: Delete temporary backend
        if: always()
        timeout-minutes: 5
        run: |
          pkill -f "supabase functions serve" > /dev/null 2>&1 || true
          supabase stop --no-backup > /dev/null 2>&1 || true
          # Belt and braces: remove anything the CLI left behind.
          ids=$(docker ps -aq --filter "label=com.supabase.cli.project" 2>/dev/null || true)
          [ -n "$ids" ] && docker rm -f $ids > /dev/null 2>&1 || true
          vols=$(docker volume ls -q --filter "label=com.supabase.cli.project" 2>/dev/null || true)
          [ -n "$vols" ] && docker volume rm -f $vols > /dev/null 2>&1 || true
          nets=$(docker network ls -q --filter "label=com.supabase.cli.project" 2>/dev/null || true)
          [ -n "$nets" ] && docker network rm $nets > /dev/null 2>&1 || true
          rm -f /tmp/supabase-start.log
          left=$(docker ps -aq --filter "label=com.supabase.cli.project" 2>/dev/null | wc -l)
          if [ "$left" -ne 0 ]; then
            echo "::error::${left} temporary backend container(s) still running after cleanup"
            exit 1
          fi
          echo "Temporary backend deleted."
