name: Combined review refresh
on:
  push:
    branches: [review/combined-updates-2026-11-13]
    paths: [.github/workflows/combined-review-refresh.yml]
permissions: {}
concurrency:
  group: combined-review-refresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/stale-commit-check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Apply reviewed dependency versions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const updates={'@hookform/resolvers':'^5.9.2','@lovable.dev/cloud-auth-js':'^1.2.3','@lovable.dev/email-js':'^0.6.0','@playwright/test':'^1.65.0','@supabase/supabase-js':'^2.119.0','@tailwindcss/vite':'^4.3.4','@tanstack/react-query':'^5.106.1','@tanstack/react-router':'1.170.46','@tanstack/react-start':'1.169.4','@tanstack/router-plugin':'1.168.48','jspdf-autotable':'^5.0.9','lucide-react':'1.70.0','react':'^19.3.1','react-dom':'^19.3.1','react-hook-form':'^7.91.0','react-resizable-panels':'^4.18.1','tailwindcss':'^4.3.4','@react-email/render':'^2.2.0','@lovable.dev/vite-plugin-dev-server-bridge':'^1.3.3','@lovable.dev/vite-plugin-hmr-gate':'^1.8.2','@lovable.dev/vite-tanstack-config':'2.27.0','@types/node':'26.6.6','eslint-plugin-prettier':'^5.5.7','typescript-eslint':'^8.72.1','vite':'8.3.6','vitest':'^4.1.12'};
          for(const [name,version] of Object.entries(updates)) for(const section of ['dependencies','devDependencies']) if(name in p[section]) p[section][name]=version;
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          JS
      - name: Regenerate locks and inventories
        run: |
          npx --yes --registry=https://registry.npmjs.org npm@11.21.1 install --registry=https://registry.npmjs.org --package-lock-only --ignore-scripts --no-audit --no-fund
          npx --yes --registry=https://registry.npmjs.org bun@1.3.14 install --registry=https://registry.npmjs.org --lockfile-only --ignore-scripts
          node scripts/ci/check-npm-lockfile-hygiene.mjs --fix-urls
          node scripts/ci/preflight-manifest-drift.mjs
          node scripts/generate-sbom.mjs
          node scripts/ci/check-quarantine.mjs
      - name: Save dependency files through the repository API
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.REPO_PUSH_TOKEN }}
          script: |
            const fs=require('fs'); const {owner,repo}=context.repo;
            const ref=context.ref.replace('refs/heads/','');
            const current=await github.rest.git.getRef({owner,repo,ref:'heads/'+ref});
            if(current.data.object.sha!==context.sha) throw new Error('Branch advanced; refusing stale write');
            const parent=await github.rest.git.getCommit({owner,repo,commit_sha:context.sha});
            const files=['package.json','package-lock.json','bun.lock','docs/sbom.cdx.json','docs/sbom.cdx.json.sha256','public/security-docs/sbom.cdx.json','public/security-docs/sbom.cdx.json.sha256'];
            const tree=[];
            for(const path of files){const blob=await github.rest.git.createBlob({owner,repo,encoding:'base64',content:fs.readFileSync(path).toString('base64')});tree.push({path,mode:'100644',type:'blob',sha:blob.data.sha});}
            const result=await github.rest.git.createTree({owner,repo,base_tree:parent.data.tree.sha,tree});
            const commit=await github.rest.git.createCommit({owner,repo,message:'Consolidate 26 dependency updates and regenerated inventories',tree:result.data.sha,parents:[context.sha]});
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+ref,sha:commit.data.sha,force:false});
