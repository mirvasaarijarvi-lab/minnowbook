name: Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-with-diagnostics

      - name: Cache Bun dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Verify bun.lock is in sync with package.json
        uses: ./.github/actions/verify-bun-lockfile-sync

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Restores ESLint's per-file result cache so unchanged files are skipped.
      # Keyed on the lint config + dependency set so any rule/version change
      # invalidates it; the sha suffix makes every run save a fresh copy.
      - name: Cache ESLint results
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/eslint
          key: ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.js', 'bun.lock', 'package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.js', 'bun.lock', 'package.json') }}-
            ${{ runner.os }}-eslint-

      - name: Run ESLint
        run: bun run lint

      - name: Lint BlogPost JSON-LD (fails on any warning)
        id: blog_jsonld
        run: bun run lint:blog-jsonld
        env:
          BLOG_JSONLD_REPORT_DIR: blog-jsonld-report

      - name: Upload BlogPost JSON-LD report
        if: always() && hashFiles('blog-jsonld-report/report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blog-jsonld-report
          path: blog-jsonld-report/
          if-no-files-found: ignore
          retention-days: 14

