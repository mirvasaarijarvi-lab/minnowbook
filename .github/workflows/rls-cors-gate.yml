name: RLS / CORS Security Gate

# Hard gate dedicated to two attack-surface classes that are easy to
# regress silently and hardest to recover from in production:
#
#   1. Row-Level Security — any cross-tenant data leak.
#   2. CORS / preflight    — any browser-trust downgrade on an edge
#      function (missing Allow-Headers, wildcard on a credentialed
#      route, missing security triad on error paths, etc).
#
# The other security workflows (security-scan.yml, security-tests.yml,
# cross-tenant-rls.yml) still run the full matrix on a slower cadence.
# This one runs the RLS- and CORS-specific subset on EVERY push/PR so
# a regression in either class blocks merge with a clearly-named gate.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static, secret-free, network-free check that the gate below is still wired
  # to everything it claims to protect (jobs, secrets, preflight step, required
  # RLS/CORS test files). Runs in milliseconds and fails with one actionable
  # error per problem, so a mis-wired gate never reports a hollow success.
  gate-config:
    name: RLS/CORS gate configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate gate configuration
        run: node scripts/ci/check-rls-cors-gate-config.mjs

  rls-cors-tests:
    name: RLS + CORS regression tests
    needs: [gate-config]
    runs-on: ubuntu-latest
    # Surfaced to the notification job so a tenant-access denial is reported
    # immediately instead of being buried in a failed job's logs.
    outputs:
      tenant_access: ${{ steps.preflight.outputs.mode }}
      denied_title: ${{ steps.preflight.outputs.denied_title }}
      denied_reason: ${{ steps.preflight.outputs.denied_reason }}
      denied_details: ${{ steps.preflight.outputs.denied_details }}
    steps:

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-with-diagnostics

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile

      # Fail fast, before any 30-minute suite, when this run cannot actually
      # reach the two test tenants. Without this the live suites skip
      # themselves and the gate reports success while asserting nothing.
      # Prints which inputs are present (never their values) and the exact
      # API refusal reason when access is denied.
      # Every gate step below tees its output into test-reports/logs so the
      # whole run can be downloaded as one artifact. Reading a failure from a
      # 30-minute live suite in the browser log viewer is slow and truncates;
      # the artifact keeps the full text of each step in a separate file.
      - name: Prepare log directory
        run: mkdir -p test-reports/logs test-reports/vitest

      - name: Preflight tenant access
        id: preflight
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RLS_TEST_TENANT_A_EMAIL: ${{ secrets.RLS_TEST_TENANT_A_EMAIL }}
          RLS_TEST_TENANT_A_PASSWORD: ${{ secrets.RLS_TEST_TENANT_A_PASSWORD }}
          RLS_TEST_TENANT_A_ID: ${{ secrets.RLS_TEST_TENANT_A_ID }}
          RLS_TEST_TENANT_B_EMAIL: ${{ secrets.RLS_TEST_TENANT_B_EMAIL }}
          RLS_TEST_TENANT_B_PASSWORD: ${{ secrets.RLS_TEST_TENANT_B_PASSWORD }}
          RLS_TEST_TENANT_B_ID: ${{ secrets.RLS_TEST_TENANT_B_ID }}
        run: |
          set -o pipefail
          node scripts/ci/rls-cors-gate-preflight.mjs 2>&1 \
            | tee test-reports/logs/01-preflight.log

      # Run only the RLS + CORS slices of the security suite.
      #
      # Use the dedicated live config explicitly. The default Vitest config
      # intentionally excludes LIVE_SECURITY_TESTS so the deterministic
      # Type-check & Build job cannot duplicate these network probes in
      # parallel. Positional paths below narrow the live inventory to this
      # gate's RLS slice.
      # Serialised on purpose: these files all dial the SAME live project
      # with anon clients. Running them in parallel forks saturated the
      # connection pool and produced 109 "Test timed out" failures in one
      # 32-minute run. LIVE_FETCH_TIMEOUT_MS additionally caps any stalled
      # socket at 15s (see src/test/setup.ts).
      - name: Run RLS regression tests
        env:
          LIVE_FETCH_TIMEOUT_MS: "15000"
        run: |
          set -o pipefail
          mkdir -p test-reports/vitest test-reports/logs
          bunx vitest run --config vitest.security-live.config.ts \
            --no-file-parallelism \
            --reporter=verbose \
            --reporter=json --outputFile=test-reports/vitest/rls-gate.json \
            src/test/security/cross-tenant-rls.test.ts \
            src/test/security/cross-tenant-log-isolation.test.ts \
            src/test/security/cross-tenant-storage.test.ts \
            src/test/security/pagination-negative-rls.test.ts \
            src/test/security/tenant-table-manifest.test.ts \
            src/test/security/guest-reviews-and-tenants-rls.test.ts \
            src/test/security/code-redemption-cross-tenant.test.ts \
            src/test/security/duplicate-tenant-membership.test.ts \
            src/test/security/storage-offer-pdf-isolation.test.ts 2>&1 \
            | tee test-reports/logs/02-rls-suites.log

      # When the preflight verified live access, an all-skipped run is a
      # silent failure, not a pass. Require real assertions.
      - name: Require the live RLS suites to have executed
        if: steps.preflight.outputs.mode == 'live'
        run: |
          set -euo pipefail
          mkdir -p test-reports/logs
          exec > >(tee test-reports/logs/03-live-assertions.log) 2>&1
          report=test-reports/vitest/rls-gate.json
          if [ ! -f "$report" ]; then
            echo "::error title=RLS gate report missing::$report was not produced, so the live run cannot be verified."
            exit 1
          fi
          passed=$(jq '.numPassedTests // 0' "$report")
          pending=$(jq '.numPendingTests // 0' "$report")
          total=$(jq '.numTotalTests // 0' "$report")
          echo "Live RLS results: ${passed} passed, ${pending} skipped, ${total} total."
          {
            echo "### RLS gate live results"
            echo ""
            echo "| passed | skipped | total |"
            echo "|---|---|---|"
            echo "| ${passed} | ${pending} | ${total} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -eq 0 ]; then
            echo "::error title=RLS gate asserted nothing::Tenant access was verified by the preflight, but every live RLS test skipped. Treating this as a gate failure."
            exit 1
          fi
          echo "✅ Live RLS suites executed with ${passed} passing assertions."

      - name: Run live CORS regression test
        env:
          LIVE_FETCH_TIMEOUT_MS: "15000"
        run: |
          bunx vitest run --config vitest.security-live.config.ts \
            --reporter=verbose \
            src/test/security/edge-function-cors-custom-headers.test.ts

      - name: Run offline CORS regression tests
        run: |
          bunx vitest run \
            --reporter=verbose \
            src/test/security/cors-validation.test.ts \
            src/test/security/edge-function-hsts-referrer-csp.test.ts \
            src/test/security/edge-function-csp.test.ts \
            src/test/security/public-booking-response-headers.test.ts

      - name: Upload RLS gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-cors-gate-report
          path: test-reports/vitest/rls-gate.json
          if-no-files-found: ignore
          retention-days: 7


  # A tenant-access denial means the gate could not assert isolation at all —
  # the most important failure this workflow can produce, and the easiest to
  # miss inside a red job. Report it as a GitHub issue (one open issue,
  # commented on for each new run) so it lands in the normal notifications.
  notify-tenant-denial:
    name: Notify blocked tenant access
    needs: [rls-cors-tests]
    if: always() && needs.rls-cors-tests.outputs.tenant_access == 'denied'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Write run summary
        env:
          DENIED_TITLE: ${{ needs.rls-cors-tests.outputs.denied_title }}
          DENIED_REASON: ${{ needs.rls-cors-tests.outputs.denied_reason }}
        run: |
          {
            echo "### 🚫 RLS/CORS gate: tenant access denied"
            echo ""
            echo "**${DENIED_TITLE:-Tenant access denied}**"
            echo ""
            echo "${DENIED_REASON:-No reason reported.}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Open or update the tenant access denial issue
        uses: actions/github-script@v7
        env:
          DENIED_TITLE: ${{ needs.rls-cors-tests.outputs.denied_title }}
          DENIED_REASON: ${{ needs.rls-cors-tests.outputs.denied_reason }}
          DENIED_DETAILS: ${{ needs.rls-cors-tests.outputs.denied_details }}
        with:
          script: |
            const label = 'rls-gate-denial';
            const title = 'RLS/CORS gate: tenant access denied';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The RLS/CORS security gate could not reach its test tenants, so cross-tenant isolation was **not** asserted on this run.`,
              '',
              `- Reason: **${process.env.DENIED_TITLE || 'Tenant access denied'}**`,
              `- Detail: ${process.env.DENIED_REASON || '(none reported)'}`,
              `- Branch/ref: \`${context.ref}\``,
              `- Commit: ${context.sha}`,
              `- Run: ${runUrl}`,
              '',
              process.env.DENIED_DETAILS || '',
              '',
              'Fix the tenant credentials or membership, then re-run the gate. This issue is reused for later denials and can be closed once the gate is green.',
            ].join('\n');

            // Make sure the label exists (ignore "already exists").
            try {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: 'b60205',
                description: 'RLS/CORS gate could not reach its test tenants',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }

            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
              per_page: 10,
            });
            const open = existing.data.find((issue) => issue.title === title);

            if (open) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open.number,
                body,
              });
              core.notice(`Commented on existing denial issue #${open.number}.`);
              return;
            }

            const created = await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              labels: [label],
            });
            core.notice(`Opened denial issue #${created.data.number}.`);




  rls-advisor-gate:
    name: Supabase RLS advisor gate
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Fail the build if the Supabase advisors API reports any
      # RLS-class finding at WARN or ERROR. Unlike the general
      # security-scan.yml (which only blocks on ERROR per the
      # maintenance policy), the RLS gate is stricter: any policy
      # gap — disabled RLS, policy referencing a mutable function,
      # missing policy for an operation — fails the job.
      - name: Fetch advisors and gate on RLS findings
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF not configured — skipping advisor RLS gate."
            exit 0
          fi
          api="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/advisors/security"

          # Capture body + HTTP status separately so a transient 5xx,
          # 401, or HTML error page does not blow up jq with a parse
          # error and mask the real failure cause.
          tmp_body=$(mktemp)
          http_code=$(curl -sS -o "$tmp_body" -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "$api" || echo "000")
          resp=$(cat "$tmp_body")

          echo "Advisors API HTTP status: ${http_code}"

          if [ "$http_code" != "200" ]; then
            echo "::warning title=Supabase advisors API unreachable::HTTP ${http_code} — skipping RLS advisor gate this run."
            echo "Response (first 500 chars): $(printf '%s' "$resp" | head -c 500)"
            exit 0
          fi

          if ! printf '%s' "$resp" | jq -e . >/dev/null 2>&1; then
            echo "::warning title=Supabase advisors API returned non-JSON::Skipping RLS advisor gate this run."
            echo "Response (first 500 chars): $(printf '%s' "$resp" | head -c 500)"
            exit 0
          fi

          # Match any lint whose name or category mentions RLS / policy.
          rls=$(echo "$resp" | jq '[.lints[]? | select(
            (.name // "" | test("rls|policy"; "i")) or
            (.categories // [] | any(. | test("rls|policy"; "i")))
          )]')

          count=$(echo "$rls" | jq 'length')
          echo "$rls" | jq -r '.[] | "::error title=Supabase RLS advisor (\(.level))::\(.name) — \(.description)"'
          {
            echo "### Supabase RLS advisor"
            echo ""
            echo "RLS-class findings: ${count}"
            echo ""
            echo "$rls" | jq -r '.[] | "- **\(.level)** \(.name): \(.description)"'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$count" -gt 0 ]; then
            echo "❌ $count RLS-class Supabase finding(s). Fix before merging."
            exit 1
          fi
          echo "✅ No RLS-class Supabase advisor findings."

  gate-summary:
    name: RLS/CORS gate summary
    needs: [gate-config, rls-cors-tests, rls-advisor-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          config='${{ needs.gate-config.result }}'
          tests='${{ needs.rls-cors-tests.result }}'
          advisor='${{ needs.rls-advisor-gate.result }}'
          {
            echo "### RLS/CORS gate result"
            echo ""
            echo "| check | result |"
            echo "|---|---|"
            echo "| Gate configuration | ${config} |"
            echo "| RLS + CORS regression tests | ${tests} |"
            echo "| Supabase RLS advisor gate | ${advisor} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "gate-config:       ${config}"
          echo "rls-cors-tests:    ${tests}"
          echo "rls-advisor-gate:  ${advisor}"
          failed=0
          if [ "$config" != "success" ]; then
            echo "::error title=RLS/CORS gate configuration ${config}::A required gate setting is missing or misconfigured. Open the 'RLS/CORS gate configuration' job for the exact list."
            echo "- Gate configuration: ${config}" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi
          if [ "$tests" != "success" ]; then
            echo "::error title=RLS/CORS regression tests ${tests}::Either tenant access was denied (see the preflight step) or an RLS/CORS regression test failed. Open the 'RLS + CORS regression tests' job."
            echo "- RLS + CORS regression tests: ${tests}" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi
          if [ "$advisor" != "success" ]; then
            echo "::error title=Supabase RLS advisor gate ${advisor}::A policy-class advisor finding is open. Open the 'Supabase RLS advisor gate' job."
            echo "- Supabase RLS advisor gate: ${advisor}" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "✅ RLS/CORS gate passed."
