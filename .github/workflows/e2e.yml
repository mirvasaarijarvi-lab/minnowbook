name: E2E Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

# Default-deny. The job below re-grants only `contents: read`. The
# Playwright report is uploaded via actions/upload-artifact which
# uses the per-run artifact endpoint and does not require additional
# token scopes.
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      # The preview server imports @supabase/supabase-js, whose realtime
      # client needs a native WebSocket. That only exists on Node 22+, so an
      # older Node makes every server-rendered page return 500.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-with-diagnostics


      - name: Cache Bun dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        # node_modules is always rebuilt from the lockfile: a partially
        # restored or stale tree has shipped react 18 alongside react-dom 19,
        # which aborts the preview server before Playwright can connect.
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile
          react_version=$(node -p "require('./node_modules/react/package.json').version")
          react_dom_version=$(node -p "require('./node_modules/react-dom/package.json').version")
          echo "react $react_version / react-dom $react_dom_version"
          if [ "$react_version" != "$react_dom_version" ]; then
            echo "::error title=React version mismatch::react $react_version vs react-dom $react_dom_version after a frozen install. Regenerate bun.lock."
            exit 1
          fi

      - name: Resolve Playwright version
        id: pw
        # Read the version actually resolved in node_modules so the cache key
        # tracks the lockfile, not just the package.json range.
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        # On a cache hit we still need OS-level shared libs but not the
        # browser binaries themselves; --with-deps is a no-op for already
        # downloaded browsers, so this stays cheap when warm.
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi

      # The Vite client at src/integrations/supabase/client.ts reads
      # VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY at BUILD time
      # (they are inlined into the bundle by Vite). The CI checkout has no
      # .env, so without these secrets the built bundle ships with
      # `createClient(undefined, undefined, ...)` and every public booking
      # / tenant lookup silently returns null. The whole app then renders
      # "Business not found", masking real regressions.
      #
      # If the secrets aren't configured (e.g. forks), self-skip with a
      # clear notice rather than running a guaranteed-red E2E suite.
      - name: Verify build-time Supabase env
        id: env-check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=()
          [ -z "$VITE_SUPABASE_URL" ]            && missing+=("VITE_SUPABASE_URL")
          [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ] && missing+=("VITE_SUPABASE_PUBLISHABLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::E2E skipped — missing build-time secrets: ${missing[*]}. Configure under Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        if: steps.env-check.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: E2E_PREVIEW_BUILD=1 bunx vite build

      - name: Run E2E tests
        if: steps.env-check.outputs.ready == 'true'
        # Specs that seed an ephemeral tenant (guest portal flow, cross
        # booking) read SERVICE_ROLE_KEY / anon key at runtime and self-skip
        # when they are absent, so pass them through or those specs never run.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SERVICE_ROLE_KEY:-}" ]; then
            echo "::notice::SUPABASE_SERVICE_ROLE_KEY not configured, backend-seeded specs will self-skip."
          fi
          bunx playwright test


      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-run-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright junit + traces
        # test-reports/playwright/{junit.xml,results.json} are produced by
        # playwright.config.ts; test-results/ holds traces, screenshots,
        # videos, and stack-trace dumps for any failing test.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-run-${{ github.run_id }}
          path: |
            test-reports/playwright/
            test-results/
          if-no-files-found: warn
          retention-days: 14
