name: SBOM

# Regenerates docs/sbom.cdx.json (CycloneDX 1.5) and uploads it as a
# build artifact whenever dependencies change or on demand.
#
# The committed copy under docs/ is what the public /security page links
# to. CI re-generates and uploads on every dependency change so that a
# reviewer can confirm the committed file matches the current lockfile.

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "scripts/generate-sbom.mjs"
      - ".github/workflows/sbom.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "scripts/generate-sbom.mjs"
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions: {}

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: generate-sbom
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # No dependency cache here: this repo uses bun.lock, and
          # setup-node's npm cache requires a package-lock.json /
          # npm-shrinkwrap.json / yarn.lock, so enabling it fails the job.
          # The SBOM generator reads bun.lock directly and installs nothing.
      - name: Generate SBOM
        run: node scripts/generate-sbom.mjs
      - name: Verify committed SBOM matches lockfile
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if ! git diff --quiet -- docs/sbom.cdx.json docs/sbom.cdx.json.sha256 \
            public/security-docs/sbom.cdx.json public/security-docs/sbom.cdx.json.sha256; then
            echo "::error::SBOM is out of date. Run 'node scripts/generate-sbom.mjs' and commit."
            git diff --stat -- docs/sbom.cdx.json public/security-docs/sbom.cdx.json
            git diff -- docs/sbom.cdx.json | head -50
            exit 1
          fi
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: docs/sbom.cdx.json
          if-no-files-found: error

  # When dependency records change on main (or on the weekly run), regenerate
  # both SBOM files and, if they differ, open an auto-merging pull request.
  # A pull request is used instead of a direct push so main's required checks
  # still apply. REPO_PUSH_TOKEN (Actions secret: fine-grained token for this
  # repository, Contents + Pull requests read and write) is needed because
  # pushes made with GITHUB_TOKEN do not start the required checks.
  # Loop-safe: the SBOM files are not in this workflow's path filter.
  refresh-on-main:
    name: refresh-sbom-on-main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Require the push token
        env:
          PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error title=Missing REPO_PUSH_TOKEN::Add an Actions secret named REPO_PUSH_TOKEN (fine-grained token, this repository, Contents and Pull requests: read and write) so SBOM refreshes can be committed automatically."
            exit 1
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          token: ${{ secrets.REPO_PUSH_TOKEN }}
          persist-credentials: true
      - uses: ./.github/actions/stale-commit-check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Regenerate SBOM
        run: node scripts/generate-sbom.mjs
      - name: Open auto-merging pull request if the SBOM changed
        env:
          GH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FILES="docs/sbom.cdx.json docs/sbom.cdx.json.sha256 public/security-docs/sbom.cdx.json public/security-docs/sbom.cdx.json.sha256"
          # shellcheck disable=SC2086
          if git diff --quiet -- $FILES; then
            echo "SBOM files already match the dependency records."
            exit 0
          fi
          BRANCH="automation/sbom-refresh"
          git config user.name "sbom-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # shellcheck disable=SC2086
          git add $FILES
          git commit -m "chore(sbom): regenerate SBOM for ${SHA:0:7}"
          git push --force origin "$BRANCH"
          if ! gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -qx OPEN; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(sbom): regenerate SBOM" \
              --body "Automatic refresh of both SBOM files after a dependency change on main."
          fi
          gh pr merge "$BRANCH" --auto --squash
