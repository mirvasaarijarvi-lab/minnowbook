name: Offer kitchen mapping

# Guards the contract between the offer form's kitchen preview and the kitchen
# order lines an accepted offer writes: every cross-booking function's food and
# drinks field must reach the correct dining or event kitchen order, and empty
# fields must create nothing.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  # Fast gate on the project's own toolchain (Bun on Linux), so a broken
  # mapping fails within seconds instead of waiting for the whole matrix.
  offer-kitchen-mapping:
    name: Cross-booking mapping and preview tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-with-diagnostics

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Verify bun.lock is in sync with package.json
        uses: ./.github/actions/verify-bun-lockfile-sync

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Run cross-booking mapping and preview tests
        run: bun run test:offer-kitchen

      - name: Upload test report
        if: always() && hashFiles('offer-kitchen-report/report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: offer-kitchen-report
          path: offer-kitchen-report/
          if-no-files-found: ignore
          retention-days: 14

  # Environment matrix: the same tests under every supported Node.js version
  # on Linux, macOS and Windows, so a failure caused by the runtime or the
  # operating system (line endings, path handling, Intl data) is caught here
  # rather than on a contributor's machine.
  matrix:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    needs: offer-kitchen-mapping
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "24"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-with-diagnostics
        with:
          # The checksum step needs sha256sum, which only the Linux runner
          # ships; the pinned version itself is still installed everywhere.
          verify-checksum: ${{ runner.os == 'Linux' }}

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Report environment
        shell: bash
        run: |
          echo "OS: ${{ matrix.os }} ($(uname -s 2>/dev/null || echo windows))"
          echo "Node: $(node --version)"
          echo "Bun: $(bun --version)"

      # Run through npm so the tests execute on the matrix Node.js version
      # rather than on Bun's runtime.
      - name: Run cross-booking mapping and preview tests on Node
        shell: bash
        run: npm run test:offer-kitchen

      - name: Upload test report
        if: always() && hashFiles('offer-kitchen-report/report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: offer-kitchen-report-${{ matrix.os }}-node${{ matrix.node }}
          path: offer-kitchen-report/
          if-no-files-found: ignore
          retention-days: 14
