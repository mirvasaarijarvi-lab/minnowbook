name: Dependabot lockfile refresh

# Dependabot runs in Bun mode, so its pull requests only update bun.lock.
# This workflow regenerates package-lock.json on those pull requests and
# the SBOM files, and pushes them back to the Dependabot branch, so "Lockfile sync (npm)" can pass.
#
# Token: a push made with the default GITHUB_TOKEN does not start other
# workflows, so the required checks would never run on the new commit.
# The push therefore uses the Dependabot secret REPO_PUSH_TOKEN
# (a fine-grained token for this repository with "Contents: read and
# write"). Without that secret the job stops with a clear error and does
# not push anything.
#
# Safety: runs only for pull requests opened by Dependabot from this
# repository. npm runs with --package-lock-only --ignore-scripts, so no
# package code is executed.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: dependabot-lockfile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: refresh-package-lock
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Require the push token
        env:
          PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error title=Missing REPO_PUSH_TOKEN::Add a Dependabot secret named REPO_PUSH_TOKEN (fine-grained token, this repository, Contents: read and write) so package-lock.json can be refreshed on Dependabot pull requests."
            exit 1
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.REPO_PUSH_TOKEN }}
          persist-credentials: true

      - uses: ./.github/actions/stale-commit-check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Regenerate package-lock.json
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node scripts/ci/check-npm-lockfile-hygiene.mjs --fix-urls
          node scripts/ci/check-npm-lockfile-hygiene.mjs

      - name: Regenerate SBOM
        run: node scripts/generate-sbom.mjs

      - name: Commit and push if it changed
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          FILES="package-lock.json docs/sbom.cdx.json docs/sbom.cdx.json.sha256 public/security-docs/sbom.cdx.json public/security-docs/sbom.cdx.json.sha256"
          # shellcheck disable=SC2086
          if git diff --quiet -- $FILES; then
            echo "package-lock.json and SBOM already in sync; nothing to push."
            exit 0
          fi
          git config user.name "dependabot-lockfile-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add $FILES
          git commit -m "chore(deps): refresh package-lock.json and SBOM"
          git push origin "HEAD:${BRANCH}"
          echo "Pushed refreshed package-lock.json to ${BRANCH}."
