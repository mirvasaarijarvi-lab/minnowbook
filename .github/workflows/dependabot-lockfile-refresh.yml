name: Dependabot lockfile refresh

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: dependabot-lockfile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: refresh-package-lock
    if: >-
      github.event.pull_request.head.ref == 'review/combined-lovable-2026-11-22' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/stale-commit-check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Setup pinned Bun
        uses: ./.github/actions/setup-bun-with-diagnostics
      - name: Apply only the four reviewed PR 170 updates
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.dependencies['@tanstack/react-query'] !== '5.104.2' || p.overrides.ws !== '>=8.23.0') throw new Error('Safety pins changed');
          p.dependencies['@testing-library/user-event'] = '^14.6.12';
          p.dependencies['lucide-react'] = '1.74.0';
          p.dependencies['react-resizable-panels'] = '^4.24.0';
          p.devDependencies['typescript-eslint'] = '^8.73.0';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          JS
      - name: Refresh both lockfiles and inventories
        run: |
          bun install --lockfile-only --ignore-scripts --no-summary
          npx --yes --registry=https://registry.npmjs.org npm@11.21.1 install --registry=https://registry.npmjs.org --package-lock-only --ignore-scripts --no-audit --no-fund
          node scripts/ci/check-npm-lockfile-hygiene.mjs --fix-urls
          node scripts/ci/check-npm-lockfile-hygiene.mjs
          node scripts/ci/preflight-manifest-drift.mjs
          node scripts/ci/check-dependency-floors.mjs
          node scripts/generate-sbom.mjs
      - name: Verify inherited fixes and dependency holds
        run: |
          bun install --frozen-lockfile --ignore-scripts --no-summary
          bunx vitest run scripts/ci/dashboard-query-pin.test.ts scripts/ci/ws-security.test.ts scripts/ci/offer-storage-path.test.ts scripts/ci/github-actions-frequency.test.ts scripts/ci/guest-email-and-premium-support-access.test.ts
      - name: Restore assembly workflow and push only intended files
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$PUSH_TOKEN"
          git show a99fa3a616a8542e13c5f54d8d1b3b292f4dccf1:.github/workflows/dependabot-lockfile-refresh.yml > .github/workflows/dependabot-lockfile-refresh.yml
          git config user.name 'combined-lovable-review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock package-lock.json docs/sbom.cdx.json docs/sbom.cdx.json.sha256 public/security-docs/sbom.cdx.json public/security-docs/sbom.cdx.json.sha256 .github/workflows/dependabot-lockfile-refresh.yml
          git commit -m 'Combine PR 170 dependencies while preserving all November 22 Lovable fixes'
          echo "::add-mask::${PUSH_TOKEN}"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"
