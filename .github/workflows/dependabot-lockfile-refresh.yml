name: Dependabot lockfile refresh
on:
  push:
    branches: [dependabot/bun/minor-and-patch-edf3a532b6]
permissions: {}
concurrency:
  group: dependabot-lockfile-refresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    if: contains(github.event.head_commit.message, 'Repair PR 158 dashboard update')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/stale-commit-check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Setup pinned Bun
        uses: ./.github/actions/setup-bun-with-diagnostics
      - name: Preserve working Query and apply four intended updates
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.dependencies['@tanstack/react-query'] !== '5.104.2') throw Error('Query safety pin missing');
          const updates={'@tanstack/react-start':['1.169.4','1.169.5'],'@tanstack/router-plugin':['1.168.48','1.169.0'],'@testing-library/user-event':['^14.6.8','^14.6.9'],'lucide-react':['1.70.0','1.71.0']};
          for(const [name,[old,next]] of Object.entries(updates)) { if(p.dependencies[name] !== old) throw Error('Unexpected baseline: '+name); p.dependencies[name]=next; }
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          JS
          bun install --lockfile-only --ignore-scripts --no-summary
          npx --yes --registry=https://registry.npmjs.org npm@11.21.1 install --registry=https://registry.npmjs.org --package-lock-only --ignore-scripts --no-audit --no-fund
          node scripts/ci/check-npm-lockfile-hygiene.mjs --fix-urls
          node scripts/ci/check-npm-lockfile-hygiene.mjs
          node scripts/ci/preflight-manifest-drift.mjs
          node scripts/ci/check-dependency-floors.mjs
          node scripts/generate-sbom.mjs
      - name: Verify every resolved Query copy is the working version
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for(const name of ['@tanstack/react-query','@tanstack/query-core']) {
            const copies=Object.entries(lock.packages).filter(([k])=>k.endsWith('node_modules/'+name));
            if(!copies.length || copies.some(([,v])=>v.version!=='5.104.2')) throw Error('Unsafe npm resolution: '+name);
          }
          const bun=fs.readFileSync('bun.lock','utf8');
          for(const name of ['@tanstack/react-query','@tanstack/query-core']) {
            const versions=[...bun.matchAll(new RegExp('"'+name+'@([^"\\s]+)"','g'))].map(m=>m[1]);
            if(!versions.length || versions.some(v=>v!=='5.104.2')) throw Error('Unsafe Bun resolution: '+name);
          }
          JS
      - name: Restore original workflow and publish corrected PR files
        env:
          GH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo=os.environ['REPO']; branch=os.environ['BRANCH']; expected=os.environ['EXPECTED']
          def api(path, method='GET', body=None):
              args=['gh','api','repos/'+repo+'/'+path,'--method',method]
              if body is not None: args += ['--input','-']
              r=subprocess.run(args,input=json.dumps(body) if body is not None else None,text=True,capture_output=True)
              if r.returncode: raise RuntimeError(r.stderr)
              return json.loads(r.stdout)
          if api('git/ref/heads/'+branch)['object']['sha'] != expected: raise RuntimeError('PR head changed; refusing overwrite')
          original=api('contents/.github/workflows/dependabot-lockfile-refresh.yml?ref=8e12730d75a8d2fa16d212b7b692234e8f10ae97')
          paths=['package.json','bun.lock','package-lock.json','docs/sbom.cdx.json','docs/sbom.cdx.json.sha256','public/security-docs/sbom.cdx.json','public/security-docs/sbom.cdx.json.sha256']
          entries=[{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text()} for p in paths]
          entries.append({'path':'.github/workflows/dependabot-lockfile-refresh.yml','mode':'100644','type':'blob','sha':original['sha']})
          tree=api('git/trees','POST',{'base_tree':api('git/commits/'+expected)['tree']['sha'],'tree':entries})
          commit=api('git/commits','POST',{'message':'fix(deps): retain dashboard-verified Query 5.104.2 in PR #158, refresh four other updates','tree':tree['sha'],'parents':[expected]})
          api('git/refs/heads/'+branch,'PATCH',{'sha':commit['sha'],'force':False})
          print('Published corrected PR commit:',commit['sha'])
          PY
